<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTracker | Cadastrar jogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav aria-label="Navegação principal">
            <a class="logo" href="dashboard.html">GameTracker</a>

            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="colecao.html">Minha coleção</a>
                <a href="buscar.html">Buscar jogos</a>
                <a href="jogo-form.html">Adicionar jogo</a>
                <a href="index.html">Sair</a>
            </div>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-card">
            <div class="page-header">
                <p>Novo jogo</p>

                <h1>Cadastrar jogo</h1>

                <p>
                    Preencha os dados do jogo para adicioná-lo
                    à sua coleção.
                </p>
            </div>

            <form action="jogo.html" method="get">
                <fieldset>
                    <legend>Informações do jogo</legend>

                    <div class="form-group">
                        <label for="nome">Nome do jogo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Ex.: Cyberpunk 2077"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="genero">Gênero</label>

                        <select id="genero" name="genero">
                            <option value="">
                                Selecione um gênero
                            </option>

                            <option value="acao">Ação</option>
                            <option value="aventura">Aventura</option>
                            <option value="rpg">RPG</option>
                            <option value="fps">FPS</option>
                            <option value="terror">Terror</option>
                            <option value="estrategia">Estratégia</option>
                            <option value="corrida">Corrida</option>
                            <option value="esporte">Esporte</option>
                            <option value="luta">Luta</option>
                            <option value="plataforma">Plataforma</option>
                            <option value="roguelike">Roguelike</option>
                            <option value="simulacao">Simulação</option>
                            <option value="sandbox">Sandbox</option>
                            <option value="sobrevivencia">Sobrevivência</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="plataforma">Plataforma</label>

                        <select id="plataforma" name="plataforma" required>
                            <option value="">
                                Selecione uma plataforma
                            </option>

                            <option value="pc">PC</option>
                            <option value="playstation">PlayStation 5</option>
                            <option value="xbox">Xbox Series X/S</option>
                            <option value="switch">Nintendo Switch</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="desenvolvedora">
                            Desenvolvedora
                        </label>

                        <input
                            type="text"
                            id="desenvolvedora"
                            name="desenvolvedora"
                            placeholder="Ex.: CD Projekt Red">
                    </div>

                    <div class="form-group">
                        <label for="ano">
                            Ano de lançamento
                        </label>

                        <input
                            type="number"
                            id="ano"
                            name="ano"
                            min="1950"
                            max="2100">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Acompanhamento pessoal</legend>

                    <div class="form-group">
                        <label for="status">
                            Status de jogo
                        </label>

                        <select id="status" name="status" required>
                            <option value="">
                                Selecione o status
                            </option>

                            <option value="pretendo-jogar">
                                Pretendo jogar
                            </option>

                            <option value="jogando">Jogando</option>
                            <option value="concluido">Concluído</option>
                            <option value="abandonado">Abandonado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nota">Nota pessoal</label>

                        <input
                            type="number"
                            id="nota"
                            name="nota"
                            min="0"
                            max="10"
                            step="0.5"
                            placeholder="0 a 10">
                    </div>

                    <div class="form-group">
                        <label for="horas">Horas jogadas</label>

                        <input
                            type="number"
                            id="horas"
                            name="horas"
                            min="0"
                            placeholder="Ex.: 86">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Imagem</legend>

                    <div class="form-group">
                        <label for="imagem">
                            Imagem/capa do jogo
                        </label>

                        <input
                            type="url"
                            id="imagem"
                            name="imagem"
                            placeholder="Cole a URL da imagem">
                    </div>
                </fieldset>

                <div class="actions">
                    <button class="button" type="submit">
                        Salvar jogo
                    </button>

                    <a class="button secondary" href="colecao.html">
                        Cancelar
                    </a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GameTracker</p>
    </footer>

</body>
</html>
